name: Build & Export Android APK + iOS IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: tiksave-app

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze & Run Unit Tests
        run: |
          flutter analyze
          flutter test

      - name: Build Universal & Split Release APK
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/TikSave-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/TikSave-universal.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikSave-Android-APK
          path: |
            tiksave-app/build/app/outputs/flutter-apk/TikSave-arm64-v8a.apk
            tiksave-app/build/app/outputs/flutter-apk/TikSave-universal.apk
          retention-days: 30

  build-ios-ipa:
    name: Build iOS Unsigned IPA (AltStore / Sideloadly / TrollStore)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Attach ShareExtension Target to Xcode Project
        run: |
          gem install xcodeproj --no-document
          ruby ios/scripts/setup_share_extension.rb

      - name: Build iOS Release (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app into Unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r9 TikSave-unsigned.ipa Payload

      - name: Upload iOS Unsigned IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikSave-iOS-Unsigned-IPA
          path: tiksave-app/build/ios/iphoneos/TikSave-unsigned.ipa
          retention-days: 30

  publish-release:
    name: Publish Latest APK & IPA to GitHub Releases
    needs: [ build-android, build-ios-ipa ]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: TikSave-Android-APK
          path: release-assets

      - name: Download iOS IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: TikSave-iOS-Unsigned-IPA
          path: release-assets

      - name: Create or Update Latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: "TikSave Release (${{ github.ref_type == 'tag' && github.ref_name || 'Latest Build' }})"
          body: |
            ### TikSave — Obsidian Neon Bento Studio
            - **Android (64-bit khuyên dùng)**: `TikSave-arm64-v8a.apk`
            - **Android (Universal mọi chip)**: `TikSave-universal.apk`
            - **iOS (Unsigned IPA cho Sideloadly / AltStore / TrollStore)**: `TikSave-unsigned.ipa`
          prerelease: false
          files: |
            release-assets/TikSave-arm64-v8a.apk
            release-assets/TikSave-universal.apk
            release-assets/TikSave-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
